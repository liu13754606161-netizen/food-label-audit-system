<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>食品标签智能识别与合规审核系统 · 交互演示</title>
<meta name="description" content="食品标签智能识别与合规审核系统交互演示：OCR识别、图文核对、合规审核评分、标签生成、二次核对、记录管理。" />
<style>
  :root{
    --navy:#0f1a33;--navy-2:#162344;--navy-3:#1d2d55;
    --primary:#2f6bff;--primary-d:#1e56e8;--primary-l:#eaf1ff;
    --bg:#f3f5fa;--card:#ffffff;--line:#e5e9f2;--line-2:#eef1f7;
    --t1:#1b2440;--t2:#5a6580;--t3:#9aa4bd;
    --green:#12a06a;--green-l:#e6f7f0;--amber:#e09015;--amber-l:#fff5e3;
    --red:#e0404f;--red-l:#fdecef;--cyan:#0aa5b8;--cyan-l:#e6f7fa;
    --shadow:0 1px 3px rgba(20,35,70,.05),0 8px 24px rgba(20,35,70,.05);
    --shadow-lg:0 12px 40px rgba(20,35,70,.14);
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none} button,input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c9d1e3;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

  /* icon sprite */
  .ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ============ layout ============ */
  .app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:60px 1fr;height:100vh;overflow:hidden}
  .topbar{grid-column:1/3;background:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;color:var(--t1);z-index:10;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15.5px;letter-spacing:.3px;color:var(--t1)}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4d8dff,#7b6bff);
    display:grid;place-items:center;box-shadow:0 4px 14px #4d8dff44}
  .brand .mark svg{width:19px;height:19px;color:#fff}
  .brand small{display:block;font-size:9px;color:var(--t3);font-weight:500;letter-spacing:1.6px;margin-top:1px}
  .top-right{display:flex;align-items:center;gap:18px;font-size:12.5px}
  .demo-tag{display:flex;align-items:center;gap:7px;background:var(--primary-l);border:1px solid #d7e4ff;
    padding:6px 12px;border-radius:100px;color:var(--primary);font-size:11.5px}
  .demo-tag .d{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 6px #16a34a88}
  .user{display:flex;align-items:center;gap:9px;color:var(--t2)}
  .user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6d7bff,#a06bff);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

  /* sidebar */
  .sidebar{background:#fff;color:var(--t2);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;border-right:1px solid var(--line)}
  .side-label{font-size:10px;letter-spacing:1.5px;color:var(--t3);padding:8px 12px 10px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--t2);
    padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13px;transition:.2s;position:relative}
  .nav button:hover{background:var(--primary-l);color:var(--primary)}
  .nav button.on{background:var(--primary-l);color:var(--primary);font-weight:600}
  .nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:linear-gradient(#4d8dff,#7b6bff);border-radius:0 3px 3px 0}
  .nav button .ico{width:17px;height:17px}
  .nav button .badge{margin-left:auto;font-size:10px;background:#fdecef;color:var(--red);padding:1px 7px;border-radius:100px}
  .side-foot{margin-top:auto;padding:14px 12px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--t3);line-height:1.7}
  .side-foot b{color:var(--t2)}

  /* main */
  .main{overflow-y:auto;position:relative;background:var(--bg)}
  .demo-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#eef4ff,#f7faff);
    border-bottom:1px solid #dbe7ff;color:var(--t2);padding:9px 26px;font-size:12px}
  .demo-banner .ico{width:16px;height:16px;color:var(--primary)}
  .demo-banner b{color:var(--primary)}
  .demo-banner .x{margin-left:auto;background:none;border:0;color:var(--t3);cursor:pointer;font-size:18px;line-height:1}
  .page{padding:26px 30px 50px;max-width:1400px;margin:0 auto}

  /* page head */
  .pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
  .crumb{font-size:11.5px;color:var(--t3);margin-bottom:8px}
  .crumb b{color:var(--t2);font-weight:600}
  .pg-head h1{font-size:22px;font-weight:750;letter-spacing:-.3px;margin-bottom:6px}
  .pg-head p{font-size:12.5px;color:var(--t2);max-width:720px;line-height:1.65}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--t1);
    padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap}
  .btn .ico{width:15px;height:15px}
  .btn:hover{border-color:#b9c6e6;box-shadow:0 2px 8px #1b244012;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#4d7dff);border-color:transparent;color:#fff;box-shadow:0 4px 14px #2f6bff38}
  .btn.primary:hover{box-shadow:0 6px 18px #2f6bff55}
  .btn.ghost-danger{color:var(--red);border-color:#f3c9cf;background:#fff}
  .btn.sm{padding:7px 11px;font-size:11.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-2)}
  .card-h h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card-b{padding:18px}

  /* badges */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap}
  .pill.green{background:var(--green-l);color:var(--green)}
  .pill.amber{background:var(--amber-l);color:var(--amber)}
  .pill.red{background:var(--red-l);color:var(--red)}
  .pill.blue{background:var(--primary-l);color:var(--primary)}
  .pill.gray{background:#eef1f7;color:var(--t2)}
  .pill.cyan{background:var(--cyan-l);color:var(--cyan)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ===== food card ===== */
  .food-card{margin-bottom:18px;overflow:hidden}
  .food-top{display:flex;align-items:center;gap:12px;padding:15px 18px;background:linear-gradient(90deg,#f8faff,#fff)}
  .food-idx{width:30px;height:30px;border-radius:8px;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .food-name{font-weight:700;font-size:14.5px}
  .food-name small{display:block;font-weight:400;color:var(--t3);font-size:11px;margin-top:2px}
  .food-top .spacer{flex:1}
  .uploads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 18px}
  .up{border:1.5px dashed #cdd6e8;border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s;
    background:#fbfcff;position:relative;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .up:hover{border-color:var(--primary);background:var(--primary-l)}
  .up input{display:none}
  .up .ico{width:22px;height:22px;color:#8fa4d4}
  .up .t{font-size:11.5px;font-weight:600;color:var(--t2)}
  .up .s{font-size:10px;color:var(--t3)}
  .up.done{border-style:solid;border-color:#9fe0c5;background:var(--green-l)}
  .up.done .ico{color:var(--green)}
  .up .thumb{width:100%;height:46px;object-fit:cover;border-radius:6px;margin-bottom:2px}
  .up .fname{font-size:10px;color:var(--green);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up .chk{position:absolute;top:7px;right:7px;width:17px;height:17px;background:var(--green);border-radius:50%;display:grid;place-items:center;color:#fff}
  .up .chk .ico{width:11px;height:11px;color:#fff}

  /* compare result */
  .cmp{margin:0 18px 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cmp-h{display:flex;align-items:center;gap:16px;padding:11px 14px;background:#f7f9fd;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .cmp-h b{font-size:12.5px}
  .stat{font-size:11px;color:var(--t2)}
  .stat b{color:var(--t1)}
  .cmp-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .cmp-tbl th{background:#fafbfe;text-align:left;padding:9px 12px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--line-2);font-size:10.5px;white-space:nowrap}
  .cmp-tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .cmp-tbl tr:last-child td{border-bottom:0}
  .cmp-tbl tr.diff-row{background:#fffbf3}
  .cmp-tbl .fk{font-weight:600;color:var(--t1);min-width:96px}
  .val{color:var(--t2);max-width:230px;line-height:1.5}
  .final-in{width:100%;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11.5px;color:var(--t1);background:#fff}
  .final-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #2f6bff18}
  .src-sel{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--t2);white-space:nowrap}
  .src-sel label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .src-sel input{accent-color:var(--primary)}
  .mfr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 18px}
  .mfr{border:1px solid var(--line);border-radius:9px;padding:12px}
  .mfr .h{font-size:11.5px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .mfr .h i{width:8px;height:8px;border-radius:50%}
  .mfr .row{display:flex;gap:8px;margin-bottom:6px;font-size:10.5px}
  .mfr .row span{color:var(--t3);width:42px;flex:none}
  .mfr .row b{color:var(--t2);font-weight:500;line-height:1.4}

  /* progress overlay */
  .overlay{position:fixed;inset:0;background:#dde5f2aa;backdrop-filter:blur(3px);display:none;place-items:center;z-index:100}
  .overlay.show{display:grid}
  .prog-box{background:#fff;border-radius:16px;padding:30px 34px;width:380px;box-shadow:var(--shadow-lg);text-align:center}
  .prog-box .spin{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;border:4px solid var(--primary-l);border-top-color:var(--primary);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .prog-box h3{font-size:15px;margin-bottom:6px}
  .prog-box p{font-size:11.5px;color:var(--t2);margin-bottom:18px}
  .bar{height:8px;background:#eef1f7;border-radius:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#7b6bff);border-radius:10px;transition:width .25s}
  .prog-box .pt{font-size:11px;color:var(--t3);margin-top:9px}

  /* ===== tabs ===== */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;color:var(--t2);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.2s}
  .tabs button:hover{color:var(--primary)}
  .tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}

  /* two column */
  .two-col{display:grid;grid-template-columns:1.25fr .9fr;gap:18px;align-items:start}
  .field-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:10px}
  .field-row label{font-size:11.5px;color:var(--t2);text-align:right}
  .ipt{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12px;color:var(--t1)}
  .ipt:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #2f6bff15}
  .sec-title{font-size:12px;font-weight:700;color:var(--t1);margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--primary)}
  .nutri-tbl{width:100%;border-collapse:collapse;font-size:11.5px;border:1px solid var(--line)}
  .nutri-tbl th,.nutri-tbl td{border:1px solid var(--line-2);padding:7px 10px;text-align:left}
  .nutri-tbl th{background:#fafbfe;color:var(--t2);font-weight:600;font-size:10.5px}
  .nutri-tbl td:last-child{text-align:right;color:var(--t2)}
  .label-preview{background:#fff;border:1px solid #d5dcec;border-radius:10px;padding:18px;box-shadow:var(--shadow);font-size:11.5px}
  .label-preview .lp-h{font-size:16px;font-weight:800;text-align:center;letter-spacing:1px;margin-bottom:4px}
  .label-preview .lp-sub{text-align:center;color:var(--t3);font-size:10px;margin-bottom:14px}
  .label-preview .lp-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e6eaf2;gap:12px}
  .label-preview .lp-line span{color:var(--t3)}
  .label-preview .lp-line b{font-weight:600;text-align:right;max-width:62%}
  .warn-box{background:#fff4f4;border:1px solid #f6d3d8;color:#c03946;border-radius:8px;padding:9px 11px;font-size:11px;margin-top:12px}

  /* verify */
  .vrow{display:grid;grid-template-columns:120px 1fr 1fr 150px;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:11.5px}
  .vrow.head{background:#fafbfe;color:var(--t3);font-weight:600;font-size:10.5px}
  .vrow .k{font-weight:600}
  .vrow .old{color:var(--t2)}
  .vrow .new{color:var(--primary)}
  .choice{display:flex;gap:10px;font-size:10.5px;color:var(--t2)}

  /* audit */
  .score-wrap{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}
  .score-card{text-align:center;padding:24px 18px}
  .ring{width:170px;height:170px;margin:0 auto 14px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .v{position:absolute;inset:0;display:grid;place-content:center}
  .ring .v b{font-size:46px;font-weight:800;line-height:1;color:var(--primary)}
  .ring .v span{font-size:11px;color:var(--t3)}
  .verdict{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px}
  .verdict.fail{background:var(--red-l);color:var(--red)}
  .verdict.pass{background:var(--green-l);color:var(--green)}
  .audit-sec{margin-bottom:16px}
  .audit-sec .h{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;margin-bottom:10px}
  .issue{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:11px 13px;margin-bottom:8px;background:#fff}
  .issue.ok{border-left-color:var(--green);background:#fbfffd}
  .issue .t{font-size:12px;font-weight:600;color:var(--t1);display:flex;gap:8px;align-items:center}
  .issue .t .ico{width:15px;height:15px;color:var(--red)}
  .issue.ok .t .ico{color:var(--green)}
  .issue .d{font-size:11px;color:var(--t2);margin:6px 0 0 23px;line-height:1.6}
  .issue .fix{font-size:11px;color:var(--green);margin:5px 0 0 23px;line-height:1.6}

  /* records */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;background:#fff;color:var(--t1)}
  .rec-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .rec-tbl th{background:#fafbfe;text-align:left;padding:11px 14px;color:var(--t3);font-weight:600;font-size:10.5px;border-bottom:1px solid var(--line)}
  .rec-tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .rec-tbl tr:hover td{background:#f8faff}
  .rec-tbl .fn{font-weight:600;color:var(--t1)}
  .pager{display:flex;justify-content:flex-end;gap:6px;align-items:center;padding:14px;font-size:11.5px;color:var(--t2)}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px}
  .pager button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* drawer */
  .drawer-mask{position:fixed;inset:0;background:#0b163866;display:none;z-index:60}
  .drawer-mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;z-index:61;
    transform:translateX(100%);transition:transform .3s ease;box-shadow:var(--shadow-lg);overflow-y:auto}
  .drawer.show{transform:none}
  .drawer-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
  .drawer-h h3{font-size:15px}
  .drawer-h .x{background:none;border:0;font-size:22px;color:var(--t3);cursor:pointer}
  .drawer-b{padding:20px 22px}
  .drawer-sec{margin-bottom:20px}
  .drawer-sec h4{font-size:11px;color:var(--t3);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
  .kv{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12px}
  .kv span{color:var(--t3);width:86px;flex:none}
  .kv b{font-weight:500;color:var(--t1);line-height:1.5}

  /* toast */
  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
  .toast{background:#fff;color:var(--t1);border:1px solid var(--line);padding:12px 16px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:10px;animation:tin .3s ease;min-width:220px}
  .toast .ico{width:18px;height:18px;color:var(--green)}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .empty{padding:44px 20px;text-align:center;color:var(--t3);font-size:12.5px}
  .hint{font-size:11px;color:var(--t3);margin-top:10px;line-height:1.6}

  @media(max-width:1050px){.two-col{grid-template-columns:1fr}.score-wrap{grid-template-columns:1fr}.uploads{grid-template-columns:repeat(2,1fr)}.mfr-grid{grid-template-columns:1fr}}
  @media(max-width:760px){
    .app{grid-template-columns:64px 1fr}
    .sidebar{padding:14px 8px}.side-label,.nav button span,.nav button .badge,.side-foot{display:none}
    .nav button{justify-content:center;padding:12px}.nav button.on::before{left:-8px}
    .brand span:not(.mark),.top-right .user span:not(.av){display:none}
    .page{padding:18px 14px 40px}.uploads{grid-template-columns:repeat(2,1fr)}
    .cmp-tbl{font-size:10px}.demo-banner{padding:8px 14px;font-size:11px}
  }
</style>
</head>
<body>

<!-- icon sprite -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>

function newFood(i){

}

function toast(msg){
  const w=$('#toastWrap');const t=document.createElement('div');t.className='toast';
  t.innerHTML='<svg class="ico"><use href="#i-check"/></svg><span>'+esc(msg)+'</span>';w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2600);
}
function progress(title,desc,steps,cb){
  $('#progTitle').textContent=title;$('#progDesc').textContent=desc;
  const bar=$('#progBar'),txt=$('#progText');let p=0;$('#overlay').classList.add('show');bar.style.width='0';
  const iv=setInterval(()=>{
    p=Math.min(100,p+(Math.random()*14+8));bar.style.width=p+'%';txt.textContent=Math.round(p)+'%';
    if(p>=100){clearInterval(iv);setTimeout(()=>{$('#overlay').classList.remove('show');cb&&cb()},350)}
  },230);
}
function exportFile(name,content){
  const blob=new Blob(['\ufeff'+content],{type:'application/msword;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出：'+name);
}
function pgHead(crumb,title,desc,actions=''){

}

/* ---- 1. 标签内容提取 ---- */
function renderExtract(){
  let h=pgHead('标签内容提取','标签内容提取与核对',
    '每个食品上传基础信息、配料营养、厂商信息与白签文件，AI 自动识别后按约 21 项字段逐项比对，可逐字段选择最终来源。',
    `<button class="btn" data-act="add-food"><svg class="ico"><use href="#i-plus"/></svg>添加食品</button>
     <button class="btn primary" data-act="run-compare"><svg class="ico"><use href="#i-spark"/></svg>开始识别核对</button>`);
  state.foods.forEach((f,i)=>{
    const up=(key,label,sub,ic)=>{
      const done=f.uploads[key];
      return `<label class="up ${done?'done':''}" data-up="${key}" data-food="${i}">
        <input type="file" accept="image/*,.pdf,.doc,.docx" ${done?'':''}/>
        ${done?'<span class="chk"><svg class="ico"><use href="#i-check"/></svg></span>':''}
        <div class="thumb-box">${done?'<svg class="ico"><use href="#i-'+ic+'"/></svg>':''}</div>
        <div class="t">${label}</div><div class="s">${done?'已识别 · 点击替换':sub}</div></label>`;
    };
    h+=`<div class="card food-card">
      <div class="food-top"><div class="food-idx">${i+1}</div>
        <div class="food-name">${esc(f.name)}<small>${esc(f.sub)}</small></div>
        <div class="spacer"></div>
        <span class="pill ${f.compared?'green':'gray'}">${f.compared?'<span class="dot"></span>核对完成':'待识别'}</span>
        <button class="btn sm ghost-danger" data-act="del-food" data-i="${i}" title="删除食品"><svg class="ico"><use href="#i-trash"/></svg></button>
      </div>
      <div class="uploads">
        ${up('basic','基础信息截图','点击或拖拽上传','image')}
        ${up('nutrition','配料 / 营养截图','点击或拖拽上传','image')}
        ${up('mfr','厂商截图','点击或拖拽上传','image')}
        ${up('doc','核对文件（白签）','PDF / DOC / DOCX','file')}
      </div>`;
    if(f.compared){
      const diff=f.fields.filter(x=>x.img!==x.doc).length;
      const same=f.fields.length-diff;
      h+=`<div class="cmp">
        <div class="cmp-h"><b>字段核对结果</b>
          <span class="stat">共 <b>${f.fields.length}</b> 项</span>
          <span class="stat">一致 <b style="color:var(--green)">${same}</b></span>
          <span class="stat">需确认 <b style="color:var(--amber)">${diff}</b></span>
          <span style="flex:1"></span>
          <span class="pill blue">逐字段裁决最终值</span></div>
        <div style="overflow-x:auto"><table class="cmp-tbl">
          <thead><tr><th>核对字段</th><th>图片识别结果</th><th>文档提取结果</th><th>最终值（可编辑）</th><th>使用来源</th></tr></thead><tbody>`;
      f.fields.forEach((x,j)=>{
        const isDiff=x.img!==x.doc;
        h+=`<tr class="${isDiff?'diff-row':''}">
          <td class="fk">${esc(x.k)}<div style="font-size:9px;color:var(--t3);font-weight:400">${x.g}</div></td>
          <td class="val">${esc(x.img)}</td>
          <td class="val">${isDiff?'<span style="color:var(--amber)">'+esc(x.doc)+'</span>':esc(x.doc)}</td>
          <td><input class="final-in" data-i="${i}" data-j="${j}" value="${esc(x.final)}"/></td>
          <td><div class="src-sel">
            <label><input type="radio" name="src_${i}_${j}" value="img" data-src="img" data-i="${i}" data-j="${j}" ${x.src==='img'?'checked':''}/>图片</label>
            <label><input type="radio" name="src_${i}_${j}" value="doc" data-src="doc" data-i="${i}" data-j="${j}" ${x.src==='doc'?'checked':''}/>文档</label>
          </div></td></tr>`;
      });
      h+='</tbody></table></div></div>';
      h+=`<div class="mfr-grid">
        ${[['supplier','原料生产商'],['consignor','委托方'],['entrusted','被委托方']].map(([k,n])=>{
          const m=MFR[k];return `<div class="mfr"><div class="h"><i style="background:${m.c}"></i>${n}</div>
            <div class="row"><span>名称</span><b>${esc(m.n)}</b></div>
            <div class="row"><span>地址</span><b>${esc(m.a)}</b></div>
            <div class="row"><span>电话</span><b>${esc(m.p)}</b></div>
            <div class="row"><span>许可</span><b>${esc(m.l)}</b></div></div>`;
        }).join('')}
      </div>`;
    }
    h+=`<div style="padding:0 18px 16px;display:flex;gap:10px;justify-content:flex-end">
      ${f.compared?`<button class="btn primary sm" data-act="to-generate"><svg class="ico"><use href="#i-arrow"/></svg>确认并进入标签展示</button>`:
      `<button class="btn sm" data-act="single-compare" data-i="${i}"><svg class="ico"><use href="#i-play"/></svg>识别此食品</button>`}
    </div></div>`;
  });
  return h;
}

     <button class="btn primary" data-act="export-label"><svg class="ico"><use href="#i-download"/></svg>导出标签 Word</button>`);
  h+=`<div class="two-col"><div>`;
  h+=`<div class="card" style="margin-bottom:18px"><div class="card-h"><h3><svg class="ico" style="color:var(--primary)"><use href="#i-file"/></svg>识别出的食品信息</h3>
      <span class="pill green"><span class="dot"></span>已从文档提取</span></div>
    <div class="tabs">${state.foods.map((f,i)=>`<button class="${i===state.genTab?'on':''}" data-act="gen-tab" data-i="${i}">${esc(f.name)}</button>`).join('')}</div>
    <div class="card-b">`;
  const f=state.foods[state.genTab]||state.foods[0];
  [['食品名称',f.name],['净含量','43 克'],['产品标准代号','GB/T 19343'],['生产许可证号','SC11333048100018'],['产地','浙江省嘉兴市']].forEach(([k,v])=>{
    h+=`<div class="field-row"><label>${k}</label><input class="ipt" value="${esc(v)}"/></div>`;
  });
  h+=`<div class="sec-title">厂商信息（三类主体）</div>`;
  [['supplier','原料生产商'],['consignor','委托方'],['entrusted','被委托方']].forEach(([k,n])=>{
    const m=MFR[k];h+=`<div class="field-row"><label>${n}</label><input class="ipt" value="${esc(m.n)}"/></div>`;
  });
  h+=`<div class="sec-title">营养成分表</div>
    <table class="nutri-tbl"><thead><tr><th>项目</th><th>每 100 克</th><th>营养素参考值%</th></tr></thead><tbody>
    ${NUTRI.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:14px;display:flex;gap:10px"><button class="btn primary sm" data-act="to-verify"><svg class="ico"><use href="#i-arrow"/></svg>进入二次核对</button>
    <button class="btn sm" data-act="to-audit"><svg class="ico"><use href="#i-shield"/></svg>执行合规审核</button></div>
  </div></div></div>`;
  h+=`<div><div class="card"><div class="card-h"><h3><svg class="ico" style="color:var(--primary)"><use href="#i-grid"/></svg>标签预览</h3>
      <span class="pill cyan">实时生成</span></div><div class="card-b">
    <div class="label-preview">
      <div class="lp-h">${esc(f.name)}</div>
      <div class="lp-sub">净含量 43 克 · 食品标签示例</div>
      <div class="lp-line"><span>配料</span><b>白砂糖、可可脂、全脂奶粉…</b></div>
      <div class="lp-line"><span>生产商</span><b>${esc(MFR.supplier.n)}</b></div>
      <div class="lp-line"><span>委托方</span><b>${esc(MFR.consignor.n)}</b></div>
      <div class="lp-line"><span>许可证号</span><b>SC11333048100018</b></div>
      <div class="lp-line"><span>保质期</span><b>12 个月</b></div>
      <div class="warn-box">致敏物质：含有乳成分、大豆，可能含坚果</div>
    </div>
    <p class="hint">预览随编辑内容实时更新，可导出为 Word 文档用于印刷核对。</p>
  </div></div></div></div>`;
  return h;
}

/* ---- 3. 二次核对 ---- */
function renderVerify(){
  let h=pgHead('二次核对','二次核对与最终确认',
    '对 AI 识别结果与人工录入值逐字段差异比对，不一致项可自主选择采用原始值或更新值，确认后生成最终结果并导出 Word。',
    `<button class="btn primary" data-act="run-verify"><svg class="ico"><use href="#i-play"/></svg>${state.verifyDone?'重新比对':'开始核对'}</button>
     <button class="btn" data-act="export-verify"><svg class="ico"><use href="#i-download"/></svg>导出最终结果</button>`);
  const rows=[
    ['生产商名称',MFR.supplier.n,'C公司',true],
    ['净含量','43 克','43g',false],
    ['致敏物质','含有乳成分、大豆','含乳、大豆、坚果',true],
    ['委托方名称',MFR.consignor.n,MFR.consignor.n,false],
    ['许可证号','SC11333048100018','SC11333048100018',false],
    ['被委托方',MFR.entrusted.n,MFR.entrusted.n,false],
  ];
  h+=`<div class="card"><div class="card-h"><h3><svg class="ico" style="color:var(--primary)"><use href="#i-grid"/></svg>字段差异比对</h3>
    <span class="pill ${state.verifyDone?'green':'gray'}">${state.verifyDone?'<span class="dot"></span>已完成 '+rows.length+' 项比对':'待核对'}</span></div>
    <div style="overflow-x:auto">
    <div class="vrow head" style="min-width:760px"><div class="k">核对字段</div><div>原始提取值</div><div>人工更新值</div><div>采用</div></div>`;
  rows.forEach((r,i)=>{
    h+=`<div class="vrow" style="min-width:760px"><div class="k">${r[0]}</div>
      <div class="old">${esc(r[1])}</div><div class="new">${esc(r[2])}</div>
      <div class="choice"><label><input type="radio" name="v_${i}" value="old" ${!r[3]?'checked':''}/>原始</label>
      <label><input type="radio" name="v_${i}" value="new" ${r[3]?'checked':''}/>更新</label></div></div>`;
  });
  h+=`</div><div class="card-b" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <span class="pill amber"><span class="dot"></span>2 项存在差异</span>
    <span class="hint" style="margin:0">差异项需人工确认后，方可导出最终结果。</span></div></div>`;
  return h;
}

/* ---- 4. 合规审核 ---- */
function renderAudit(){
  let h=pgHead('合规审核','合规审核与智能评分',
    '按 GB 7718-2025 国标与企业标准双标准校验，扣分制自动评分，输出不合规项与整改建议。',
    `<button class="btn primary" data-act="run-audit"><svg class="ico"><use href="#i-shield"/></svg>${state.auditDone?'重新审核':'开始审核'}</button>
     <button class="btn" data-act="export-audit"><svg class="ico"><use href="#i-download"/></svg>导出审核报告</button>`);
  if(!state.auditDone){
    return h+`<div class="card"><div class="empty" style="padding:80px 20px">
      <svg class="ico" style="width:46px;height:46px;color:#c3cee6;margin:0 auto 16px"><use href="#i-shield"/></svg>
      <div style="font-size:15px;font-weight:600;color:var(--t1);margin-bottom:6px">尚未执行合规审核</div>
      <div>点击右上角「开始审核」，系统将按国标与企业标准自动评分</div>
      <button class="btn primary" style="margin-top:18px" data-act="run-audit"><svg class="ico"><use href="#i-play"/></svg>开始审核</button>
    </div></div>`;
  }
  h+=`<div class="score-wrap"><div class="card score-card">
    <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170">
      <circle cx="85" cy="85" r="72" fill="none" stroke="#eef1f7" stroke-width="12"/>
      <circle cx="85" cy="85" r="72" fill="none" stroke="url(#ag)" stroke-width="12" stroke-linecap="round" stroke-dasharray="452.4" stroke-dashoffset="99.5"/>
      <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2f6bff"/><stop offset="1" stop-color="#7b6bff"/></linearGradient></defs>
    </svg><div class="v"><b>78</b><span>综合得分 / 100</span></div></div>
    <div class="verdict fail"><svg class="ico" style="width:14px;height:14px"><use href="#i-alert"/></svg>存在 3 项待整改</div>
    <p class="hint">扣分规则：企业标准每项 −15，国标每项 −5，最低 0 分</p>
  </div><div>`;
  ISSUES.forEach(it=>{
    h+=`<div class="audit-sec"><div class="h"><span class="pill ${it.ok?'green':'gray'}">${it.g}</span></div>
      <div class="issue ${it.ok?'ok':''}">
        <div class="t"><svg class="ico"><use href="#i-${it.ok?'check':'alert'}"/></svg>${esc(it.t)}</div>
        <div class="d">${esc(it.d)}</div>
        ${it.f?`<div class="fix">${esc(it.f)}</div>`:''}
      </div></div>`;
  });
  h+='</div></div>';
  return h;
}

/* ---- 5. 记录管理 ---- */
function renderRecords(){
  let h=pgHead('记录管理','记录管理与统一归档',
    '审核与生成记录统一入库，支持按类型、状态筛选，查看记录详情、审核结果与导出文件。');
  h+=`<div class="filters">
    <select data-filter="type"><option value="all">全部类型</option><option value="audit" ${state.recFilter.type==='audit'?'selected':''}>审核记录</option><option value="generate" ${state.recFilter.type==='generate'?'selected':''}>生成记录</option></select>
    <select data-filter="status"><option value="all">全部状态</option><option value="success" ${state.recFilter.status==='success'?'selected':''}>成功</option><option value="processing" ${state.recFilter.status==='processing'?'selected':''}>处理中</option><option value="failed" ${state.recFilter.status==='failed'?'selected':''}>失败</option></select>
    <span class="hint" style="margin-left:auto">共 ${RECORDS.length} 条记录</span></div>`;
  const list=RECORDS.filter(r=>(state.recFilter.type==='all'||r.type===state.recFilter.type)&&(state.recFilter.status==='all'||r.status===state.recFilter.status));
  h+=`<div class="card"><div style="overflow-x:auto"><table class="rec-tbl">
    <thead><tr><th>记录 ID</th><th>类型</th><th>文件名</th><th>状态</th><th>评分</th><th>创建时间</th><th></th></tr></thead><tbody>`;
  const st={success:['green','成功'],processing:['blue','处理中'],failed:['red','失败']};
  list.forEach(r=>{const s=st[r.status];
    h+=`<tr data-act="open-record" data-id="${r.id}"><td style="color:var(--t2);font-family:monospace">${r.id}</td>
      <td><span class="pill ${r.type==='audit'?'blue':'cyan'}">${r.type==='audit'?'审核':'生成'}</span></td>
      <td class="fn">${esc(r.name)}</td><td><span class="pill ${s[0]}"><span class="dot"></span>${s[1]}</span></td>
      <td>${r.score==='—'?'<span style="color:var(--t3)">—</span>':'<b style="color:'+(r.score>=80?'var(--green)':'var(--amber)')+'">'+r.score+'</b>'}</td>
      <td style="color:var(--t2)">${r.date}</td><td style="color:var(--t3)">查看详情 ›</td></tr>`;
  });
  h+='</tbody></table></div>';
  if(!list.length)h+='<div class="empty">没有符合筛选条件的记录</div>';
  h+=`<div class="pager"><span>第 1 页 / 共 1 页</span><button disabled>‹</button><button class="on">1</button><button disabled>›</button></div></div>`;
  return h;
}

/* ============================================================
   事件处理
   ============================================================ */
function bindDynamic(){
  // 文件上传
  $$('.up input[type=file]').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const file=e.target.files[0];if(!file)return;
      const up=inp.closest('.up'),fi=+up.dataset.food,key=up.dataset.up;
      state.foods[fi].uploads[key]=true;
      const box=$('.thumb-box',up);
      if(file.type.startsWith('image/')){
        const url=URL.createObjectURL(file);
        box.innerHTML='<img class="thumb" src="'+url+'"/>';
      }else{box.innerHTML='<svg class="ico"><use href="#i-file"/></svg>';}
      up.classList.add('done');
      $('.s',up).textContent='已上传 · '+file.name.slice(0,14);
      if(!up.querySelector('.chk'))up.insertAdjacentHTML('beforeend','<span class="chk"><svg class="ico"><use href="#i-check"/></svg></span>');
      toast('上传成功：'+file.name);
    });
  });
}
// 全局点击委托
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-page],[data-act]');
  if(!b)return;
  if(b.dataset.page){state.page=b.dataset.page;render();return;}
  const act=b.dataset.act;
  switch(act){
    case 'add-food':
      if(state.foods.length>=4){toast('演示版最多添加 4 个食品');break;}
      state.foods.push(newFood(state.foods.length));render();toast('已添加食品组');break;
    case 'del-food':
      if(state.foods.length<=1){toast('至少保留一个食品');break;}
      state.foods.splice(+b.dataset.i,1);render();break;
    case 'run-compare':
      progress('正在识别全部食品…','AI 视觉模型 + OCR 多源提取 + 21 项字段比对',0,()=>{
        state.foods.forEach(f=>f.compared=true);render();toast('识别完成，共核对 '+state.foods.length+' 个食品');
      });break;
    case 'single-compare':{
      const i=+b.dataset.i;
      progress('正在识别标签…','多模态模型识别 + 字段结构化提取',0,()=>{state.foods[i].compared=true;render();toast('识别完成');});break;
    }
    case 'to-generate':state.page='generate';render();break;
    case 'gen-tab':state.genTab=+b.dataset.i;render();break;
    case 'gen-upload':toast('请选择 PDF / DOC / DOCX 文档，或直接使用已提取示例数据');break;
    case 'export-label':exportFile('食品标签_'+Date.now()+'.doc','食品标签内容\n\n'+state.foods.map(f=>f.name).join('\n')+'\n\n生产商：'+MFR.supplier.n+'\n委托方：'+MFR.consignor.n);break;
    case 'to-verify':state.page='verify';render();break;
    case 'run-verify':progress('正在逐字段比对…','原始值 vs 人工录入值差异检测',0,()=>{state.verifyDone=true;render();toast('比对完成，发现 2 项差异');});break;
    case 'export-verify':exportFile('核对最终结果_'+Date.now()+'.doc','二次核对最终结果\n\n'+MFR.supplier.n+'\n净含量：43克\n致敏物质：含乳成分、大豆');break;
    case 'to-audit':state.page='audit';render();break;
    case 'run-audit':progress('正在执行合规审核…','GB 7718-2025 国标 + 企业标准双校验',0,()=>{state.auditDone=true;render();toast('审核完成，综合得分 78 分');});break;
    case 'export-audit':exportFile('合规审核报告_'+Date.now()+'.doc','合规审核报告\n\n综合得分：78 / 100\n结论：存在 3 项待整改\n\n'+ISSUES.map(i=>'【'+i.g+'】'+i.t+'\n建议：'+(i.f||'无')).join('\n\n'));break;
    case 'open-record':openRecord(b.dataset.id);break;
  }
});
// 来源选择 / 最终值编辑
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.src){const i=+t.dataset.i,j=+t.dataset.j;state.foods[i].fields[j].src=t.value;
    state.foods[i].fields[j].final=t.value==='img'?state.foods[i].fields[j].img:state.foods[i].fields[j].doc;
    const row=t.closest('tr');$('.final-in',row).value=state.foods[i].fields[j].final;}
  if(t.dataset.filter){state.recFilter[t.dataset.filter]=t.value;render();}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('final-in')){
    const i=+e.target.dataset.i,j=+e.target.dataset.j;state.foods[i].fields[j].final=e.target.value;
  }
});
// drawer
function openRecord(id){
  const r=RECORDS.find(x=>x.id===id);if(!r)return;
  $('#drawerTitle').textContent='记录详情 · '+r.id;
  const st={success:['green','成功'],processing:['blue','处理中'],failed:['red','失败']}[r.status];
  $('#drawerBody').innerHTML=`
    <div class="drawer-sec"><h4>基本信息</h4>
      <div class="kv"><span>记录 ID</span><b>${r.id}</b></div>
      <div class="kv"><span>记录类型</span><b>${r.type==='audit'?'审核记录':'生成记录'}</b></div>
      <div class="kv"><span>文件名</span><b>${esc(r.name)}</b></div>
      <div class="kv"><span>状态</span><b><span class="pill ${st[0]}">${st[1]}</span></b></div>
      <div class="kv"><span>创建时间</span><b>${r.date}</b></div>
      <div class="kv"><span>综合评分</span><b>${r.score==='—'?'—':r.score+' 分'}</b></div>
    </div>
    <div class="drawer-sec"><h4>厂商信息</h4>
      <div class="kv"><span>原料生产商</span><b>${esc(MFR.supplier.n)}</b></div>
      <div class="kv"><span>委托方</span><b>${esc(MFR.consignor.n)}</b></div>
      <div class="kv"><span>被委托方</span><b>${esc(MFR.entrusted.n)}</b></div>
    </div>
    <div class="drawer-sec"><h4>操作</h4>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn sm" data-act="export-verify"><svg class="ico"><use href="#i-download"/></svg>导出</button>
        <button class="btn sm" data-act="to-audit"><svg class="ico"><use href="#i-shield"/></svg>查看审核</button>
      </div></div>`;
  $('#drawer').classList.add('show');$('#drawerMask').classList.add('show');
}
$('#drawerClose').onclick=()=>{$('#drawer').classList.remove('show');$('#drawerMask').classList.remove('show')};
$('#drawerMask').onclick=()=>{$('#drawer').classList.remove('show');$('#drawerMask').classList.remove('show')};

/* init */
render();
</script>
